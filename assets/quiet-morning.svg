      <stop stop-color="#f5f1ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#f5f1ee" stop-opacity=".72"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#sky)"/>
  <circle cx="906" cy="105" r="39" fill="#f7f3e9" opacity=".88"/>
